name: Android device smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    name: Instalar e abrir APK no Android 15
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Habilitar aceleração KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4.0.1
      - uses: gradle/actions/wrapper-validation@v6.3.0
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Compilar APK de demonstração
        working-directory: apps/android
        run: ./gradlew --no-daemon assembleDevDebug
      - name: Instalar e iniciar no emulador
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu

            mkdir -p store-screenshots

            dump_ui() {
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb exec-out cat /sdcard/window.xml > window.xml
            }

            wait_for_text() {
              local label="$1"
              for _ in $(seq 1 20); do
                dump_ui
                if grep -Fq "text=\"${label}\"" window.xml; then
                  return 0
                fi
                sleep 1
              done

              echo "Texto não encontrado na interface: ${label}" >&2
              cat window.xml >&2
              return 1
            }

            tap_text() {
              local label="$1"
              wait_for_text "$label"

              local bounds
              bounds="$(
                sed 's/></>\n</g' window.xml |
                  grep -F "text=\"${label}\"" |
                  head -n 1 |
                  sed -n 's/.*bounds="\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]".*/\1 \2 \3 \4/p'
              )"

              if [ -z "$bounds" ]; then
                echo "Limites não encontrados para: ${label}" >&2
                return 1
              fi

              set -- $bounds
              x1="$1"
              y1="$2"
              x2="$3"
              y2="$4"
              adb shell input tap "$(((x1 + x2) / 2))" "$(((y1 + y2) / 2))"
            }

            capture() {
              local filename="$1"
              sleep 1
              adb exec-out screencap -p > "store-screenshots/${filename}"
            }

            adb install -r apps/android/app/build/outputs/apk/dev/debug/app-dev-debug.apk
            adb shell wm size 1080x1920
            adb shell wm density 420
            adb shell am start -W -n com.konaet.cover.dev/com.konaet.cover.MainActivity
            adb shell dumpsys activity activities | grep -q "com.konaet.cover.dev"

            wait_for_text "Começar"
            capture "01-onboarding.png"

            tap_text "Começar"
            wait_for_text "Entrar no modo demonstração"
            capture "02-demo-access.png"

            tap_text "Entrar no modo demonstração"
            wait_for_text "Protection Status"
            capture "03-protection-status.png"

            tap_text "Pool"
            wait_for_text "Protection Pools"
            capture "04-protection-pools.png"

            tap_text "Profile"
            wait_for_text "User Profile"
            capture "05-profile.png"
      - name: Publicar evidência do teste
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: konaet-cover-emulator-smoke
          path: store-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30

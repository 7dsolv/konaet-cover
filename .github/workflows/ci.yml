name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API - build, lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @konaet/api build
      - run: pnpm --filter @konaet/api lint
      - run: pnpm --filter @konaet/api format:check
      - run: pnpm --filter @konaet/api exec jest --runInBand

  risk-engine:
    name: Motor de risco - testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/risk-engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/risk-engine/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  contracts:
    name: Contrato - Foundry tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test -vv

  android:
    name: Android - build, lint e APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4.0.1
      - name: Instalar Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/wrapper-validation@v6.3.0
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Testar, analisar e compilar
        run: ./gradlew --no-daemon test lintDevDebug assembleDevDebug bundleProdRelease
      - name: Publicar APK e AAB de validação
        uses: actions/upload-artifact@v7
        with:
          name: konaet-cover-android-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/dev/debug/app-dev-debug.apk
            apps/android/app/build/outputs/bundle/prodRelease/app-prod-release.aab
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
